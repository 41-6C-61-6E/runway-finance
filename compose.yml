services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=768MB
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  finance-app:
    container_name: finance-app
    # M-14 (2026-08-27 security review): pin a concrete tag, never ':latest'
    # (mutable). For fully immutable deploys, pin by digest:
    #   image: alanracek/personal-finance@sha256:<digest>
    # (docker buildx imagetools inspect alanracek/personal-finance).
    # This app is now built locally (see Dockerfile); build & tag locally
    #   docker build -t alanracek/personal-finance:2026.08.27 .
    # or remove this image line entirely to rely on `build: .`.
    image: alanracek/personal-finance:2026.08.27
    ports:
      - "3001:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    env_file:
      - .env
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}        # URL where login page and app are hosted
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}  # Admin set KEY used for authenticaiton
      - UV_THREADPOOL_SIZE=16

      #Not implemented yet
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # User defined
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}      # Admin set KEY used for passowrd resets and data recovery
      # M-3: registration is CLOSED BY DEFAULT — set ALLOW_REGISTRATION=true to
      # open it, and a strong (>=8 char) REGISTRATION_PIN to further gate it.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - REGISTRATION_PIN=${REGISTRATION_PIN}
      - FRED_API_KEY=${FRED_API_KEY}
      - BUG_REPORTING=${BUG_REPORTING:-false}


      # Optional: Auto-seed AI provider for all users (all 4 required to create a provider)
      - AI_PROVIDER_NAME=${AI_PROVIDER_NAME}        # Display name (e.g. "OpenAI", "Ollama")
      - AI_PROVIDER_ENDPOINT=${AI_PROVIDER_ENDPOINT} # Base URL (e.g. "https://api.openai.com/v1")
      - AI_PROVIDER_MODEL=${AI_PROVIDER_MODEL}      # Model identifier (e.g. "gpt-4o-mini")
      - AI_PROVIDER_API_KEY=${AI_PROVIDER_API_KEY}  # API key (encrypted per-user)

      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - NEXTAUTH_TRUST_HOST=true

      # File logging and rotation settings
      - LOG_FILE_PATH=/app/logs/finance.log
      - LOG_FILE_MAX_SIZE_MB=100
      - LOG_FILE_MAX_FILES=20

    volumes:
      - app-logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  app-logs:
