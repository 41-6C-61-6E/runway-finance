name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The unit tests and app code run `git log` (e.g. GET /api/changelog).
          # CI's default fetch-depth of 1 would leave the repo with a single
          # commit, breaking tests that expect real commit history.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: TZ=America/New_York pnpm test

      - name: Lint
        run: pnpm -s lint

      - name: Typecheck
        run: pnpm -s typecheck
